name: Verify Lean proofs
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: "true"
          build-args: "--wfail"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          leanchecker: "true"
          leanchecker-args: "JSP301.Theory JSP301.Certificates JSP301"
      - name: Restate targets and audit axioms
        run: lake env lean -DwarningAsError=true Audit.lean
      - name: Reproduce certificate data
        run: |
          python3 scripts/generate_certificates.py
          git diff --exit-code -- JSP301/Certificates.lean JSP301/PrimeTable.lean
